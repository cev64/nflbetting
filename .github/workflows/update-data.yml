name: Update NFL data

on:
  schedule:
    # Once a week: Tuesday 14:00 UTC (10am ET), after Monday Night Football is final.
    # The fetcher also only publishes fully completed weeks, so a manual run mid-week
    # (e.g. after Thursday Night Football) never adds a partial week.
    - cron: "0 14 * * 2"
  workflow_dispatch:
  # Redeploy the site whenever the site or this workflow changes.
  push:
    paths: ["web/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # Pages only accepts deployments from the default branch.
    # (Scheduled runs always use the default branch; their payload has no repository info.)
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Fetch current season
        if: github.event_name != 'push'
        run: python backend/fetch_data.py

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "Update NFL data $(date -u +%Y-%m-%d)"
          git push

      # Publishes web/ to GitHub Pages. Enable it once under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: web
      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
